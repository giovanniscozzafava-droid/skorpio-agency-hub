<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<style>
  :root { --ink:#1B1F3B; --start:#FF5A36; --mint:#2EC4B6; --paper:#FAF7F2; --fog:#E8E4DD; --tint: #2F6B4F; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); font-family: 'Inter', 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--paper); }
  .display { font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; }
  .scene { position: absolute; inset: 0; opacity: 0; animation: show var(--dur) linear var(--t0) forwards; }
  @keyframes show { 0% { opacity: 0 } 4% { opacity: 1 } 97% { opacity: 1 } 100% { opacity: 0 } }
  .quincunx { position: absolute; inset: 0; opacity: .07; background-image: radial-gradient(#FAF7F2 3px, transparent 3.5px); background-size: 56px 56px; }
  .brand { position: absolute; top: 72px; left: 72px; display: flex; align-items: center; gap: 18px; font-size: 40px; letter-spacing: -0.03em; }
  .brand b { font-weight: 700 } .brand i { color: var(--start); font-style: normal; font-weight: 700 }
  .mark { width: 64px; height: 64px; display: block; }
  .hook { display: flex; flex-direction: column; justify-content: center; padding: 140px 90px; }
  .hook .emoji { font-size: 200px; line-height: 1; margin-bottom: 40px; animation: pop .6s cubic-bezier(.2,1.4,.4,1) var(--t0) both; }
  .hook h1 { font-size: 104px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 700; animation: rise .7s cubic-bezier(.2,.9,.2,1) calc(var(--t0) + .15s) both; }
  .hook h1 em { color: var(--start); font-style: normal; }
  .hook .sub { margin-top: 40px; font-size: 44px; opacity: .8; animation: rise .7s cubic-bezier(.2,.9,.2,1) calc(var(--t0) + .35s) both; }
  .product { background: var(--paper); color: var(--ink); }
  .product .top { position: absolute; left: 0; right: 0; top: 0; height: 1060px; background: color-mix(in srgb, var(--tint) 14%, var(--paper)); display: grid; place-items: center; }
  .product .pic { width: 720px; height: 720px; display: grid; place-items: center; animation: slideUp .8s cubic-bezier(.2,.9,.2,1) calc(var(--t0) + .1s) both; }
  .product .pic img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 30px 60px rgba(27,31,59,.22)); }
  .product .pic span { font-size: 380px; line-height: 1; filter: drop-shadow(0 30px 60px rgba(27,31,59,.22)); }
  .product .chip { position: absolute; top: 210px; left: 72px; width: 160px; height: 160px; border-radius: 999px; background: var(--start); color: #fff; display: grid; place-items: center; font-size: 96px; font-weight: 700; animation: pop .5s cubic-bezier(.2,1.4,.4,1) var(--t0) both; }
  .product .counter { position: absolute; top: 90px; right: 72px; font-size: 34px; font-weight: 600; opacity: .55; letter-spacing: .06em; }
  .product .body { position: absolute; left: 72px; right: 72px; top: 1120px; animation: rise .7s cubic-bezier(.2,.9,.2,1) calc(var(--t0) + .25s) both; }
  .product .role { font-size: 36px; font-weight: 700; color: var(--start); letter-spacing: .08em; text-transform: uppercase; }
  .product h2 { font-size: 84px; line-height: 1.05; letter-spacing: -0.03em; margin: 16px 0 24px; font-weight: 700; }
  .product .why { display: none; }
  .product .price { position: absolute; left: 72px; bottom: 120px; font-size: 56px; font-weight: 700; background: var(--ink); color: var(--paper); padding: 18px 40px; border-radius: 999px; animation: rise .6s cubic-bezier(.2,.9,.2,1) calc(var(--t0) + .45s) both; }
  .caption { position: absolute; left: 72px; right: 72px; bottom: 300px; font-size: 40px; font-weight: 600; line-height: 1.3; }
  .caption span { background: var(--ink); color: var(--paper); padding: 8px 22px; border-radius: 18px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hook .caption span, .outro .caption span { background: var(--paper); color: var(--ink); }
  .outro { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 120px 90px; }
  .outro .label { font-size: 40px; opacity: .75; letter-spacing: .06em; text-transform: uppercase; }
  .outro .total { font-size: 150px; font-weight: 700; letter-spacing: -0.04em; margin: 10px 0 50px; color: var(--start); animation: pop .6s cubic-bezier(.2,1.4,.4,1) calc(var(--t0) + .1s) both; }
  .outro ol { list-style: none; padding: 0; margin: 0 0 70px; display: grid; gap: 18px; }
  .outro li { font-size: 42px; display: flex; gap: 22px; align-items: center; animation: rise .5s cubic-bezier(.2,.9,.2,1) calc(var(--t0) + var(--i) * .12s + .2s) both; }
  .outro li b { width: 64px; height: 64px; border-radius: 999px; background: var(--start); display: grid; place-items: center; font-size: 34px; flex: none; }
  .outro .url { font-size: 58px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .outro .url small { display: block; font-size: 34px; font-weight: 500; opacity: .8; margin-top: 6px; }
  .outro .url i { color: var(--start); font-style: normal; }
  .outro .claim { margin-top: 20px; font-size: 44px; opacity: .85; }
  .progress { position: absolute; left: 72px; right: 72px; top: 24px; height: 10px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 100%; background: var(--start); transform-origin: left; animation: bar var(--total) linear 0s both; }
  @keyframes bar { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @keyframes rise { from { opacity: 0; transform: translateY(60px) } to { opacity: 1; transform: none } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(160px) scale(.92) } to { opacity: 1; transform: none } }
  @keyframes pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: none } }
</style>
</head>
<body>
<!--SCENES-->
<script>
  // Controllo deterministico del tempo per il rendering frame-by-frame.
  window.__setTime = (ms) => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; } };
  window.__ready = true;
</script>
</body>
</html>
